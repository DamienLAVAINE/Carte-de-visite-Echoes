<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>ECHOES - Groupe de reprises rock</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050505;color:white;font-family:Arial,Helvetica,sans-serif}
.container{width:100%;max-width:520px;margin:auto;padding:25px 18px 40px}
.logo{width:100%;max-width:430px;display:block;margin:0 auto 10px}
.subtitle{text-align:center;font-size:18px;font-weight:bold;margin:10px 0 22px;text-transform:uppercase}
.subtitle span{color:#f5b914}
.separator{height:3px;background:#f5b914;margin:20px 0 25px}
.contact-button{display:block;background:#f5b914;color:#000;text-decoration:none;text-align:center;font-weight:bold;font-size:21px;padding:19px 10px;border-radius:18px;margin-bottom:25px;box-shadow:0 4px 15px rgba(245,185,20,.25)}
.contact-row{display:flex;align-items:center;background:#171717;border-radius:16px;margin:10px 0;min-height:74px;overflow:hidden;padding-left:14px}
.contact-icon{width:55px;height:55px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.contact-icon img{width:48px;height:48px;object-fit:contain}
.contact-text{flex:1;font-size:16px;padding:0 10px;overflow-wrap:anywhere}
.action-button{width:58px;height:58px;margin-right:7px;border-radius:14px;background:#f5b914;color:#000;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:26px;flex-shrink:0}
.social-title{text-align:center;margin:35px 0 18px;font-size:15px;letter-spacing:2px;color:#aaa}
.socials{display:flex;justify-content:space-around;gap:12px}
.social{flex:1;text-decoration:none;color:white;text-align:center}
.social img{width:65px;height:65px;object-fit:contain;display:block;margin:auto}
.social-name{font-size:12px;margin-top:8px;font-weight:bold}
.footer{text-align:center;color:#f5b914;font-style:italic;font-size:18px;margin-top:35px}
</style>
</head>
<body>
<div class="container">
